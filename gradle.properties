# 这是 GTNH ExampleMod 模板的属性文件。下面所有 key = value 都是构建脚本读取的配置；
# 注释只做解释，不参与构建。已启用的值我全部保持原样，只重写说明文字。

# Blowdryer 是 GTNH 构建套件里负责 Spotless 格式化等规则的那一层。
# 这个 tag 决定用哪一版规则；0.2.2 是当前模板配套版本。
# 留空 = 关闭 Blowdryer 相关检查。一般跟随模板升级，不要随手改。
# 写成 LOCAL 是给本地调试配置更新用的。
gtnh.settings.blowdryerTag = 0.2.2

# 模组显示名，会写进 mcmod.info，游戏里/模组列表看到的就是它。
modName = Thaumic-Survival

# 模组内部标识，大小写敏感。会用于 mcmod.info，也会参与自动生成 mixin JSON。
# 按惯例全小写、不要带空格。
modId = thaumicsurvival

# 模组根包名。构建脚本靠它找主类、做 mcmod.info 替换、开 run 任务的断言等。
modGroup = com.kongtai.thaumicsurvival

# 发布 Maven 时是否用上面的 modGroup 作为 groupId。
# true = 用 com.kongtai.thaumicsurvival；false = 用 com.github.GTNewHorizons。
useModGroupForPublishing = true

# 是否在检测到新版本时自动改写 build.gradle / settings.gradle。
# 这里关掉了：避免构建脚本在你不知情时被改。想手动升级模板时可临时打开。
autoUpdateBuildScript = false

# 目标 Minecraft 版本。1.7.10 是 GTNH 体系的基础版本。
minecraftVersion = 1.7.10

# 目标 Forge 版本。1.7.10 末期的稳定版，GTNH 生态一般就用这个。
forgeVersion = 10.13.4.1614

# 依赖反混淆和 deobfParams 任务用的 MCP 通道。stable 表示用稳定映射。
channel = stable

# 对应的 MCP 映射版本号。和上面的 channel 配套使用。
mappingsVersion = 12

# 额外的 MCP 映射来源。这里指向 FML 1.7.10 分支的 conf 目录。
# 注意 https\:// 里的反斜杠是 properties 文件里冒号的转义写法，不要删。
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/

# runClient 默认使用的玩家名。每次运行也可以在命令行用
# ./gradlew runClient --username=AnotherPlayer 覆盖，或在 IDE 运行配置里改。
# 注意：当前值是 1，不是常规字母玩家名；如果启动器对用户名有校验、启动报错，
# 可以改成字母开头的名字（这属于运行参数，不影响模组构建）。
developmentEnvironmentUserName = 1

# 现代 Java 语法支持模式：
# false         = 只允许 Java 8 语法
# jabel         = 允许写高版本语法，但编译成 Java 8 字节码（当前选择，适合 1.7.10）
# jvmDowngrader = 语法和标准库 API 都做降级，功能最全但配置更复杂
# modern        = 原生高版本字节码，不做降级
enableModernJavaSyntax = jabel

# 如果设置了这个值，就忽略上面的 enableModernJavaSyntax，强制用指定 toolchain 编译。
# -1 = 不强制。大多数情况不要动，强制 toolchain 容易出意外兼容问题。
# forceToolchainVersion = -1

# 仅当 enableModernJavaSyntax = jvmDowngrader 时生效：把字节码降级到哪个 JVM 版本。
# downgradeTargetVersion = 8

# 仅 jvmDowngrader 模式：多版本 jar 支持，类会放到 META-INF/versions/N/ 下。
# 默认 21,25：J25+ 用原生类，J21–24 部分降级，J8–20 全量降级。
# jvmDowngraderMultiReleaseVersions = 21,25

# 仅 jvmDowngrader 模式：API stub 的来源。
# shade    = 把裁剪后的 stub 打进 jar（需要自己确认许可证合规）
# gtnhlib  = 由 GTNHLib 运行时提供（会加版本约束）
# external = 由其他依赖提供（不加约束、不警告）
# 留空     = 构建时警告你还没配
# jvmDowngraderStubsProvider =

# 反编译依赖时是否注入缺失的泛型，让 List/Map 等显示成 List<E>/Map<K,V>。
# 只影响你看源码的体验，不影响最终产物。建议保持开启。
enableGenericInjection = true

# 构建时生成一个带版本号字符串字段的类，方便 @Mod 里引用版本。
# 这里生成 com.kongtai.thaumicsurvival.Tags。
# 留空或删掉这一行 = 不生成这个类。
generateGradleTokenClass = com.kongtai.thaumicsurvival.Tags

# 上面那个生成类里，版本字段的名字。构建时会把项目版本填进去。
gradleTokenVersion = VERSION

# [已弃用] 旧做法：直接在指定源文件里把 GRADLETOKEN_VERSION 字符串替换成版本号。
# 现在推荐用上面的 generateGradleTokenClass，所以这里留空、不启用。
# 多个文件用逗号分隔；留空 = 不做逐文件替换。
replaceGradleTokenInFile =

# 如果你的模组要给别人提供 API，在这里写 API 子包名。
# 例如 apiPackage = api，配合 modGroup = com.kongtai.thaumicsurvival，
# API 包就是 com.kongtai.thaumicsurvival.api。
# 本项目没有对外 API，留空。
apiPackage = api

# Forge 访问转换器（AT）配置文件，必须放在 src/main/resources/META-INF/ 下。
# 多个文件用空格分隔，例如 mymodid_at.cfg nei_at.cfg。
# 不需要 AT 就留空。
accessTransformersFile =

# 是否启用 Mixin。不知道 Mixin 是什么就保持 false。
# 本项目当前不用 Mixin，所以关着。
usesMixins = false

# 把 Mixin 放到独立 source set（src/值/）而不是 src/main，可以加快编译，
# 因为不用对所有源码跑 Mixin 注解处理器。
# Mixin 类能访问 main 的类，反过来不行。
# 只有 usesMixins = true 时才有意义；这里留空。
separateMixinSourceSet =

# 是否给 Mixin 加调试参数（详细日志、导出类等）。不用 Mixin 时无意义。
usesMixinDebug = false

# 自定义 IMixinConfigPlugin 的位置。没有就留空。
mixinPlugin =

# 存放所有 Mixin 的包名。包必须真实存在，否则构建失败；
# 如果 mixins.<modid>.json 里写了 package，也必须和这里一致。
# 不用 Mixin 就留空。
mixinsPackage =

# 如果你写的是 CoreMod，在这里填实现 IFMLLoadingPlugin 的入口类。
# 这是旧版兼容参数，例如 asm.FMLPlugin 会拼成 com.kongtai.thaumicsurvival.asm.FMLPlugin。
# 普通模组留空。
coreModClass =

# 项目是否“只有 Mixin / CoreMod、没有普通 @Mod 类”。
# 本项目有普通模组主类，所以是 false。拿不准就 false。
containsMixinsAndOrCoreModOnly = false

# 即使本模组不用 Mixin，也强制启用 Mixin 环境。
# 只有当你依赖的某个模组需要 Mixin 时才打开。当前 false。
forceEnableMixins = false

# 是否允许用 shadowCompile 把依赖打进自己的 jar。
# 打开后要自己确认许可证、必要时申请分发许可。本项目不需要，false。
usesShadowedDependencies = false

# 仅在启用 shadow 时生效：是否移除 shadow 依赖里没被用到的类。
# 有些库靠反射访问自己的类，裁剪可能误伤；本项目没开 shadow，保持默认 true 即可。
minimizeShadowedDependencies = true

# 仅在启用 shadow 时生效：是否重命名 shadow 进来的类，避免和别的模组冲突。
# 本项目没开 shadow，保持默认 true 即可。
relocateShadowedDependencies = true

# 自动加入 CurseMaven、Modrinth 等常见 1.7.10 仓库，省得手动写 repository。
includeWellKnownRepositories = true

# 从上面那批“常见仓库”里排除某些源。
# 空格分隔，可用键（大小写不敏感）：cursemaven、modrinth。
# 不排除就留空。
excludeWellKnownRepositories =

# 是否启用 Maven 发布。true = 按默认 GTNH Maven 配置发布。
# 认证用 MAVEN_USER / MAVEN_PASSWORD 环境变量。
usesMavenPublishing = true

# 想发到自己的 Maven 就取消注释并改成你的地址；
# 更复杂的发布配置应该关掉 usesMavenPublishing，然后在 addon.gradle 里自己写 publishing。
# mavenPublishUrl = https\://nexus.gtnewhorizons.com/repository/releases/

# 发布到 Modrinth 需要设置 MODRINTH_TOKEN 环境变量。
# 项目 ID 可以填 slug 或数字 ID；不想发就留空。
modrinthProjectId =

# Modrinth 上的项目关系。语法：scope-type:name;scope-type:name;...
# scope：required / optional / incompatible / embedded
# type：project / version
# 例：required-project:fplib;optional-project:gasstation;incompatible-project:gregtech
# 注意：usesMixins = true 时，UniMixins 会自动被设为 required 依赖。
# 不发布/没关系就留空。
modrinthRelations =

# 发布到 CurseForge 需要设置 CURSEFORGE_TOKEN 环境变量。
# 数字项目 ID 在 CurseForge 项目页的 About Project 里找；不想发就留空。
curseForgeProjectId =

# CurseForge 上的项目关系。语法：type:slug;type:slug;...
# type：requiredDependency / embeddedLibrary / optionalDependency / tool / incompatible
# 例：requiredDependency:railcraft;embeddedLibrary:cofhlib;incompatible:buildcraft
# 同样，usesMixins = true 时 UniMixins 会自动成为 requiredDependency。
# 不发布/没关系就留空。
curseForgeRelations =

# 自定义产物文件名前缀。只有从老项目迁移、想保留旧命名时才用；
# 新项目不要设置。
# customArchiveBaseName =

# 自定义 runClient 的工作目录，相对项目根目录。默认是 run/client。
# runClientWorkingDirectory = run/client

# 自定义 runServer 的工作目录，相对项目根目录。默认是 run/server。
# runServerWorkingDirectory = run/server

# 强制版本号格式检查。只在版本来自 git tag 时生效。
# 注意字符串要转义，例如只允许 1.1.xxx 就写 1\\.1\\.\\d+。
# 不强制就保持注释。
# versionPattern =

# 取消注释 = 不发布源码 jar。默认是发布源码的。
# noPublishedSources = true

# 取消注释 = 关闭 Spotless 格式检查。
# 只有在你需要和上游/其他 fork 保持同步、避免格式冲突时才临时关；
# 没有活跃上游/ fork 的情况下不要长期关掉。
# disableSpotless = true

# 取消注释 = 关闭 Checkstyle 检查（目前主要是通配符 import 检查）。
# disableCheckstyle = true

# 覆盖 IDEA 的构建方式："" = 不覆盖，"idea" = 强制原生 IDEA 构建，"gradle" = 强制委托给 Gradle。
# 这是个人环境设置，建议写在 $HOME/.gradle/gradle.properties，不要写进项目文件，
# 否则会覆盖其他开发者的设置。
# 例：systemProp.org.gradle.project.ideaOverrideBuildType=idea
# ideaOverrideBuildType = idea

# IDEA 里点 Build 时是否顺带跑 Spotless 检查。
# 同样是个人环境设置，建议放 $HOME/.gradle/gradle.properties。
# ideaCheckSpotlessOnBuild = true

# 以下两项不是模组配置，是 Gradle 构建性能选项：
# configuration-cache 缓存配置阶段，parallel 允许任务并行。
# 注意 configuration-cache 对某些老插件可能不兼容；如果构建报配置缓存相关错误，
# 再考虑临时关掉它。
org.gradle.configuration-cache = true
org.gradle.parallel = true

modVersion = 0.1-beta